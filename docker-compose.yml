version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: freshtrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: freshtrack
      POSTGRES_PASSWORD: freshtrack_secret
      POSTGRES_DB: freshtrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshtrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshtrack_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://freshtrack:freshtrack_secret@postgres:5432/freshtrack?sslmode=disable
      PORT: 8080
      JWT_SECRET: super_secret_jwt_key_change_in_production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: freshtrack_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: